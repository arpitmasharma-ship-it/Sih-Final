version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: lmcc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: lmcc
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lmcc-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/lmcc
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_random_hex_key_in_production}
      JWT_EXPIRES_IN: 8h
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      OCR_PROVIDER: tesseract
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:5000}
    container_name: lmcc-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
